<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142C27" />
      <stop offset="50%" stop-color="#1C3F3A" />
      <stop offset="100%" stop-color="#0E201C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E06D53" />
      <stop offset="100%" stop-color="#D9534F" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="24" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="24" fill="url(#grid)" />
  <rect x="2" y="2" width="1196" height="416" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Glowing Accent Orbs -->
  <circle cx="150" cy="80" r="120" fill="#E06D53" opacity="0.12" filter="blur(40px)" />
  <circle cx="1080" cy="340" r="140" fill="#10B981" opacity="0.15" filter="blur(50px)" />

  <!-- Top Badges -->
  <g transform="translate(60, 50)">
    <rect width="360" height="34" rx="17" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1"/>
    <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FBBF24" letter-spacing="1.5">🥑 FOODOSCOPE: FORK IT CHALLENGE 2026</text>
  </g>

  <!-- Main Headline -->
  <text x="60" y="145" font-family="Georgia, serif" font-size="54" font-weight="800" fill="#FAF8F5" letter-spacing="-1">
    You Are What You Eat
  </text>
  <text x="60" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9FB5B0">
    Computational Gastronomy × Precision Chrono-Nutrition
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(60, 240)">
    <!-- Pill 1: PubMed Science -->
    <g transform="translate(0, 0)">
      <rect width="250" height="80" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1">PEER-REVIEWED SCIENCE</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FAF8F5">ISSN &amp; JISSN Citations</text>
    </g>

    <!-- Pill 2: 4-Factor Algorithm -->
    <g transform="translate(270, 0)">
      <rect width="250" height="80" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FBBF24" letter-spacing="1">MATHEMATICAL RANKING</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FAF8F5">Pantry 40% + Macros 30%</text>
    </g>

    <!-- Pill 3: FlavorDB -->
    <g transform="translate(540, 0)">
      <rect width="250" height="80" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E06D53" letter-spacing="1">MOLECULAR GASTRONOMY</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FAF8F5">FlavorDB Volatile Compounds</text>
    </g>

    <!-- Pill 4: Quick Commerce -->
    <g transform="translate(810, 0)">
      <rect width="270" height="80" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="20" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#60A5FA" letter-spacing="1">10-MIN QUICK COMMERCE</text>
      <text x="20" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#FAF8F5">Zepto &amp; Blinkit Dark Stores</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 360)">
    <text x="0" y="20" font-family="monospace" font-size="13" fill="#6EE7B7">⚡ Vite 6 • React 18 • Tailwind CSS • Framer Motion • IIIT Delhi CoSy Lab</text>
  </g>
</svg>
